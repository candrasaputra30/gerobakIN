<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GERObakIN Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: sans-serif; background: #f5f5f5; }
.header { background: #2D8B57; color: white; padding: 16px 24px; }
.header h1 { font-size: 20px; }
.nav { display: flex; gap: 8px; padding: 16px 24px; background: white; border-bottom: 1px solid #eee; flex-wrap: wrap; }
.nav button { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; background: #f0f0f0; }
.nav button.active { background: #2D8B57; color: white; }
.content { padding: 24px; }
.card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.card h2 { margin-bottom: 16px; color: #333; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
th { color: #666; font-weight: 600; }
.badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; }
.badge.pending { background: #fff3cd; color: #856404; }
.badge.completed { background: #d1e7dd; color: #0f5132; }
.badge.cancelled { background: #f8d7da; color: #842029; }
input, select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; width: 100%; margin-bottom: 8px; }
.btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
.btn-primary { background: #2D8B57; color: white; }
.btn-danger { background: #dc3545; color: white; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.stat .num { font-size: 28px; font-weight: bold; color: #2D8B57; }
.stat .label { color: #666; font-size: 13px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#login { max-width: 400px; margin: 80px auto; }
</style>
</head>
<body>

<div id="loginPage">
<div class="card" id="login">
  <h2 style="margin-bottom:16px">GERObakIN Admin Login</h2>
  <input type="text" id="loginPhone" placeholder="Nomor HP Admin">
  <input type="password" id="loginPass" placeholder="Password">
  <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Masuk</button>
  <p id="loginErr" style="color:red;margin-top:8px;font-size:13px"></p>
</div>
</div>

<div id="adminPage" style="display:none">
<div class="header"><h1>GERObakIN Admin Panel</h1></div>
<div class="nav">
  <button class="active" onclick="showTab('dashboard')">Dashboard</button>
  <button onclick="showTab('users')">Users</button>
  <button onclick="showTab('carts')">Gerobak</button>
  <button onclick="showTab('bookings')">Pesanan</button>
  <button onclick="showTab('version')">Versi App</button>
</div>
<div class="content" id="mainContent"></div>
</div>

<script>
const BASE = 'http://192.168.1.5:3000/api';
let TOKEN = '';

async function doLogin() {
  const phone = document.getElementById('loginPhone').value;
  const pass = document.getElementById('loginPass').value;
  const res = await fetch(BASE+'/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({phone, password:pass})
  });
  const data = await res.json();
  if (data.token && data.user.role === 'admin') {
    TOKEN = data.token;
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('adminPage').style.display = 'block';
    showTab('dashboard');
  } else {
    document.getElementById('loginErr').textContent = 'Login gagal atau bukan admin';
  }
}

function showTab(tab) {
  document.querySelectorAll('.nav button').forEach((b,i) => {
    b.classList.toggle('active', ['dashboard','users','carts','bookings','version'][i] === tab);
  });
  if (tab === 'dashboard') loadDashboard();
  if (tab === 'users') loadUsers();
  if (tab === 'carts') loadCarts();
  if (tab === 'bookings') loadBookings();
  if (tab === 'version') loadVersion();
}

async function api(path, method='GET', body=null) {
  const res = await fetch(BASE+path, {
    method, headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
    body: body ? JSON.stringify(body) : null
  });
  return res.json();
}

async function loadDashboard() {
  const [users, bookings, carts] = await Promise.all([
    api('/auth/users').catch(()=>([]) ),
    api('/bookings/all').catch(()=>([]) ),
    api('/rentals/carts').catch(()=>([]) ),
  ]);
  document.getElementById('mainContent').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="num">${Array.isArray(users)?users.length:'-'}</div><div class="label">Total Users</div></div>
      <div class="stat"><div class="num">${Array.isArray(bookings)?bookings.length:'-'}</div><div class="label">Total Pesanan</div></div>
      <div class="stat"><div class="num">${Array.isArray(carts)?carts.length:'-'}</div><div class="label">Jenis Gerobak</div></div>
    </div>
    <div class="card"><h2>Selamat Datang, Admin</h2><p style="color:#666;margin-top:8px">GERObakIN Admin Panel aktif</p></div>
  `;
}

async function loadCarts() {
  const carts = await api('/rentals/carts');
  document.getElementById('mainContent').innerHTML = `
    <div class="card">
      <h2>Tambah Gerobak</h2>
      <div class="form-row">
        <input id="cName" placeholder="Nama Gerobak">
        <input id="cType" placeholder="Tipe (Manual/Roda Dua/Motor)">
      </div>
      <div class="form-row">
        <input id="cHour" type="number" placeholder="Harga/Jam">
        <input id="cDay" type="number" placeholder="Harga/Hari">
      </div>
      <input id="cStock" type="number" placeholder="Stok" style="width:200px">
      <br><button class="btn btn-primary" style="margin-top:8px" onclick="addCart()">Tambah</button>
    </div>
    <div class="card">
      <h2>Daftar Gerobak</h2>
      <table>
        <tr><th>Nama</th><th>Tipe</th><th>Per Jam</th><th>Per Hari</th><th>Stok</th></tr>
        ${Array.isArray(carts) ? carts.map(c=>`
          <tr>
            <td>${c.name}</td><td>${c.type}</td>
            <td>Rp ${c.price_per_hour?.toLocaleString()}</td>
            <td>Rp ${c.price_per_day?.toLocaleString()}</td>
            <td>${c.stock}</td>
          </tr>`).join('') : '<tr><td colspan="5">Tidak ada data</td></tr>'}
      </table>
    </div>
  `;
}

async function addCart() {
  await api('/rentals/carts', 'POST', {
    name: document.getElementById('cName').value,
    type: document.getElementById('cType').value,
    price_per_hour: +document.getElementById('cHour').value,
    price_per_day: +document.getElementById('cDay').value,
    stock: +document.getElementById('cStock').value,
  });
  loadCarts();
}

async function loadBookings() {
  const bookings = await api('/bookings/all');
  document.getElementById('mainContent').innerHTML = `
    <div class="card">
      <h2>Semua Pesanan</h2>
      <table>
        <tr><th>ID</th><th>Customer</th><th>Dari</th><th>Ke</th><th>Status</th></tr>
        ${Array.isArray(bookings) ? bookings.map(b=>`
          <tr>
            <td>#${b.id}</td>
            <td>${b.customer_name||'-'}</td>
            <td>${b.pickup_location}</td>
            <td>${b.destination}</td>
            <td><span class="badge ${b.status}">${b.status}</span></td>
          </tr>`).join('') : '<tr><td colspan="5">Tidak ada pesanan</td></tr>'}
      </table>
    </div>
  `;
}

async function loadUsers() {
  document.getElementById('mainContent').innerHTML = `
    <div class="card"><h2>Users</h2><p style="color:#666">Fitur dalam pengembangan</p></div>
  `;
}

async function loadVersion() {
  const ver = await api('/version/check');
  document.getElementById('mainContent').innerHTML = `
    <div class="card">
      <h2>Update Versi Aplikasi</h2>
      <p style="color:#666;margin-bottom:16px">Versi saat ini: <strong>${ver.version}</strong></p>
      <input id="vVersion" placeholder="Versi baru (contoh: 1.0.1)" value="${ver.version}">
      <input id="vUrl" placeholder="URL download APK" value="${ver.apk_url||''}">
      <input id="vLog" placeholder="Changelog">
      <button class="btn btn-primary" onclick="updateVersion()">Update Versi</button>
    </div>
  `;
}

async function updateVersion() {
  await api('/version/update', 'PUT', {
    version: document.getElementById('vVersion').value,
    apk_url: document.getElementById('vUrl').value,
    changelog: document.getElementById('vLog').value,
  });
  alert('Versi berhasil diupdate');
  loadVersion();
}
</script>
</body>
</html>
